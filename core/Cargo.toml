[package]
name = "plumterm-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "plumterm_core"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = 3

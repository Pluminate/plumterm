name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build .deb
        run: |
          export PLUMTERM_VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || PLUMTERM_VERSION=0.0.0
          export PLUMTERM_VERSION
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target plumterm
          cpack --config build/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
